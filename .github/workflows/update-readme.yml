name: Update README with GitHub Stats and Activity

on:
  schedule:
    - cron: '0 2 1 * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Fetch GitHub Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_DATA_DIR: ${{ runner.temp }}/readme-data
        run: |
          python scripts/fetch_github_stats.py

      - name: Fetch Recent Activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          README_DATA_DIR: ${{ runner.temp }}/readme-data
        run: |
          python scripts/fetch_recent_activity.py

      - name: Update README
        env:
          README_DATA_DIR: ${{ runner.temp }}/readme-data
        run: |
          python scripts/update_readme.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update README with latest stats and activity [skip ci]"
            git push
          fi
